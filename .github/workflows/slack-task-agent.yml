name: Slack Task Scheduling Agent

on:
  schedule:
    # JST = UTC+9 → 8:00/12:00/16:00/18:00 JST = 23:00/3:00/7:00/9:00 UTC
    - cron: '0 23 * * *'  # 08:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 7 * * *'   # 16:00 JST
    - cron: '0 9 * * *'   # 18:00 JST
  workflow_dispatch:        # 手動実行（テスト用）

env:
  NOTION_TASK_DB_ID: 3604e7f2-0664-80df-a1c1-cf180b420ee8
  SLACK_NOTIFY_CHANNEL: D0ATGMNKJK1

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Slack Task Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TASK_DB_ID: ${{ env.NOTION_TASK_DB_ID }}
          SLACK_NOTIFY_CHANNEL: ${{ env.SLACK_NOTIFY_CHANNEL }}
        run: python scripts/slack_task_agent.py
